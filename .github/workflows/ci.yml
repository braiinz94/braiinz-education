name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: pytest -q --cov=src --cov-report=term-missing

      - name: Banc d'évaluation (validation et rejeu, sans clé ni réseau)
        env:
          ANTHROPIC_API_KEY: ""
        run: |
          python -m src.evals valider
          python -m src.evals executer --config actuelle --repetitions 1 --rejouer
